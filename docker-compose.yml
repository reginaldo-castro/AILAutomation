services:
  postgres:
    image: postgres:16
    container_name: ai-lead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lead_automation_db
      POSTGRES_USER: lead_user
      POSTGRES_PASSWORD: lead_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: