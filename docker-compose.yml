services:
  postgres:
    image: postgres:16
    container_name: ai-lead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lead_automation_db
      POSTGRES_USER: lead_user
      POSTGRES_PASSWORD: lead_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
      image: n8nio/n8n:latest
      container_name: ai-lead-n8n
      restart: unless-stopped
      ports:
        - "5678:5678"
      environment:
        - N8N_HOST=localhost
        - N8N_PORT=5678
        - N8N_PROTOCOL=http
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: